<div class="container">
  <div animateOnScroll="fade-up">
    <enfasis-tag [tagIcon]="''" [tagLabel]="'Nuestros servicios'"></enfasis-tag>
  </div>
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="row">
        <div class="col-12" style="text-align: center" animateOnScroll="fade-up" [animateDelay]="100">
          <h1>Soluciones completas para su negocio</h1>
          <p>Ofrecemos un amplio rango de servicios de desarrollo de software adaptados a tus necesidades específicas.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    @for (service of servicesList; track service.name) {
      <div class="col-xs-12 col-sm-12 col-md-4" animateOnScroll="fade-up" [animateDelay]="200 + ($index * 80)">
        <app-info-card [infoCard]="service" [backgroundColor]="'#f7f5f3'"></app-info-card>
      </div>
    }
  </div>
</div>
