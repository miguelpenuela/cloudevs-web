<div class="section__white">
<div class="container">
  <div animateOnScroll="fade-up">
    <enfasis-tag [tagIcon]="''" [tagLabel]="'Portafolio'"></enfasis-tag>
  </div>
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="row">
        <div class="col-12" style="text-align: center" animateOnScroll="fade-up" [animateDelay]="100">
          <h1>Proyectos que nos enorgullecen</h1>
          <p>Una selección de nuestros trabajos más recientes y destacados.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-12">
      <category-tag [category]="'Todo'"/>
      @for (c of categories; track $index) {
        <category-tag [category]="c"/>
      }
    </div>
  </div>
  <div class="row">
    @for (p of projects; track $index) {
      <div class="col-xs-12 col-sm-12 col-md-4" animateOnScroll="fade-up" [animateDelay]="200 + ($index * 120)">
        <project-card [project]="p"></project-card>
      </div>
    }
  </div>
</div>
</div>
