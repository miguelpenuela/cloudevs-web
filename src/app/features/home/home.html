<div class="container">
  <div class="row align-items-center">
    <div class="col-xs-12 col-sm-12 col-md-6">
      <div class="hero-animate hero-delay-1">
        <enfasis-tag [tagIcon]="'fa fa-code'" [tagLabel]="'Innovación en cada línea de código'"></enfasis-tag>
      </div>
      <div class="row">
        <div class="col-12">
          <h1 class="home-title hero-animate hero-delay-2">
            Transformamos tus ideas en <span class="enfasis">soluciones en la nube</span>
          </h1>
          <p class="hero-animate hero-delay-3">
            Somos Cloudevs, expertos en desarrollo de software en la nube.
            Creamos aplicaciones web, móviles y sistemas empresariales escalables
            que impulsan el crecimiento de tu negocio.
          </p>
        </div>
      </div>
      <div class="row hero-animate hero-delay-4">
        <div class="col-12">
          <button class="btn btn-primary m-3" (click)="goTo('contact')">Comenzar proyecto</button>
          <button class="btn btn-secondary" (click)="goTo('portfolio')">Ver portafolio</button>
        </div>
      </div>
      <div class="row hero-animate hero-delay-4">
        <div class="col-12">
          <hr />
        </div>
      </div>
      <div class="row hero-animate hero-delay-5">
        <div class="col-xs-12 col-sm-12 col-md-4 statistic">
          <span class="statistic__value">98%</span>
          <span class="statistic__description">Satisfacción del cliente</span>
        </div>
        <div class="col-xs-12 col-sm-12 col-md-4 statistic">
          <span class="statistic__value">10+</span>
          <span class="statistic__description">Años de experiencia</span>
        </div>
      </div>
    </div>
    <div class="col-xs-12 col-sm-12 col-md-6 hero-image-animate">
      <img src="/img/it-solution-about-img.webp" style="width: 100%" alt="Cloudevs solutions" />
    </div>
  </div>
</div>
