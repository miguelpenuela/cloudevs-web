<div class="container-fluid container-menu">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="menu">
            <div class="menu-icon" style="width: 100%">
              <a [routerLink]="'/'">
                <img class="logo" src="/img/LogoCloudevsV2.png" alt="Logo Cloudevs">
              </a>
            </div>
            <div class="menu-options-container">
              <div class="menu-options">
                <div class="menu-options_item">
                  <a (click)="goTo('home')">
                    Inicio
                  </a>
                </div>
                <div class="menu-options_item">
                  <a (click)="goTo('services')">
                    Servicios
                  </a>
                </div>
                <div class="menu-options_item">
                  <a (click)="goTo('about')">
                    Nosotros
                  </a>
                </div>
                <!--<div class="menu-options_item">
                  <a (click)="goTo('portfolio')">
                    Proyectos
                  </a>
                </div>-->
                <div class="menu-options_item">
                  <a (click)="goTo('blog')">
                    Blog
                  </a>
                </div>
                <div class="menu-options_item-enfasis">
                  <a (click)="goTo('contact')">
                    Contacto
                  </a>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
</div>
<button class="menu-mobile-btn" (click)="showMobileMenu()">
  <div class="menu-mobile-btn__content">
    <i class="fa fa-bars"></i>
  </div>
</button>
<navigation-menu-mobile [menuOpen]="showMenu" (menuClosed)="handleMenuClosed()"></navigation-menu-mobile>
